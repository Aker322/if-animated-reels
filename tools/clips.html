<script>
'use strict';
// Original GIF-style loops for the screen look: dark, moody flat scenes with one clear silhouette character.
// Every scene is drawn from scratch (no existing characters, frames or logos). SCENES.name(t) draws one frame at time t (s).
const W = 960, H = 820, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
function vgrad(y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function sky(stops) { c.fillStyle = vgrad(0, H, stops); c.fillRect(0, 0, W, H); }
function glow(x, y, r, col, a) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); }
function disc(x, y, r, col) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); c.fillStyle = col; c.fill(); }
function stars(n, seed, t, ymax = H * 0.6) { const r = rng(seed); for (let i = 0; i < n; i++) { const x = r() * W, y = r() * ymax, s = 0.6 + r() * 1.6, ph = r() * TAU; disc(x, y, s, `rgba(255,248,230,${0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * (1 + r() * 2) + ph))})`); } }
function dust(n, seed, t, col, box = [0, 0, W, H], sp = 14) {
  const r = rng(seed); const [x0, y0, bw, bh] = box;
  for (let i = 0; i < n; i++) { const x = x0 + ((r() * bw + t * sp * (0.5 + r())) % bw), y = y0 + ((r() * bh - t * sp * 0.4 * (0.3 + r()) + bh * 4) % bh), s = 0.8 + r() * 2.2; disc(x, y, s, rgba(col, 0.25 + 0.5 * r())); }
}
// the recurring character: hooded silhouette (head, messy hair, hoodie), facing the viewer or away
function figure(x, y, s, col, opt = {}) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  if (opt.sit) { c.beginPath(); c.moveTo(-60, -10); c.quadraticCurveTo(-70, 60, -40, 70); c.lineTo(120, 70); c.quadraticCurveTo(140, 40, 110, 20); c.lineTo(40, 10); c.fill(); }
  else if (!opt.bust) { c.beginPath(); c.roundRect(-46, 0, 40, 210, 16); c.roundRect(6, 0, 40, 210, 16); c.fill(); }
  c.beginPath(); c.moveTo(-82, 20); c.quadraticCurveTo(-90, -120, 0, -128); c.quadraticCurveTo(90, -120, 82, 20); c.closePath(); c.fill();     // hoodie body
  disc(0, -170, 52, col);                                                                                                                       // head
  const hair = [[-48, -196, 20], [-26, -218, 22], [2, -224, 22], [28, -216, 20], [48, -196, 18], [56, -176, 13]];
  hair.forEach(([hx, hy, hr]) => disc(hx, hy + Math.sin((opt.t || 0) * 6 + hx) * (opt.wind ? 2.5 : 0), hr, col));
  c.restore();
}
function grassLine(y0, f, t, col, n = 120, h = 26) {
  c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round'; const r = rng(7);
  for (let i = 0; i < n; i++) { const x = (i / n) * W + r() * 8, y = f(x), hh = h * (0.5 + r()), sw = Math.sin(t * 2.2 + x * 0.02) * 7; c.beginPath(); c.moveTo(x, y + 4); c.quadraticCurveTo(x + sw * 0.5, y - hh * 0.5, x + sw, y - hh); c.stroke(); }
}
function bust(x, y, s, lit, dark) {                                   // a generic marble bust (no real person's likeness)
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = dark; c.fillRect(-130, 150, 260, 120);
  c.beginPath(); c.moveTo(-190, 160); c.quadraticCurveTo(-180, 30, 0, 10); c.quadraticCurveTo(180, 30, 190, 160); c.closePath(); c.fillStyle = lit; c.fill();
  c.fillStyle = lit; c.beginPath(); c.roundRect(-38, -40, 76, 70, 20); c.fill();
  disc(0, -110, 92, lit);
  [[-80, -160, 34], [-45, -200, 36], [0, -212, 38], [45, -200, 36], [80, -160, 34], [-92, -110, 26], [92, -110, 26]].forEach(([cx, cy, r]) => disc(cx, cy, r, lit));
  [[-60, -40, 28], [-30, -10, 30], [0, 0, 30], [30, -10, 30], [60, -40, 28]].forEach(([cx, cy, r]) => disc(cx, cy, r, lit));
  c.restore();
}

const SCENES = {
